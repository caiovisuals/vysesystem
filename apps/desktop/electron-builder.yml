appId: com.vysesystem.desktop
productName: VyseSystem
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
  - resources/**
icon: resources/icon.png
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: VyseSystem
mac:
  target:
    - dmg
    - zip
  category: public.app-category.business
linux:
  target: AppImage
  category: Office

# Atualização automática: os instaladores e os arquivos latest*.yml vão para as Releases do GitHub
publish:
  provider: github
  owner: caiovisuals
  repo: vysesystem
  releaseType: draft